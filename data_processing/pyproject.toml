[project]
name = "klasifikacia-webu"
version = "0.1.0"
description = ""
authors = [
    { name = "Alex Petráš", email = "alex.petras@cesnet.cz" }
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ipykernel (>=7.2.0,<8.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
    "lxml (==6.0.2)",
    "langdetect (>=1.0.9,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "spacy (>=3.8.14,<4.0.0)",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0.tar.gz",
    "pyarrow (>=24.0.0,<25.0.0)",
]

[tool.poetry]
packages = [{ include = "klasifikacia_webu", from = "src" }]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"